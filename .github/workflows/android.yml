      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p axo-lens assembleDebug --stacktrace 2>&1 | tee build.log || {
            echo '### Build errors' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |What went wrong|error:|Could not" -A2 build.log | head -40 >> $GITHUB_STEP_SUMMARY
            exit 1
          }
